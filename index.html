<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#D8F3FE" />
<title>Loop 20</title>
<meta name="description" content="A small, quiet puzzle about putting a ring of stones back in order." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Quicksand carries the page (soft, rounded, matches the artwork). Fraunces
     is used for the numeral alone — its WONK axis gives the "20" a hand-cut
     wobble that a geometric sans can't. -->
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,600..900,0..100,0..1&family=Quicksand:wght@400..700&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   LOOP 20 — home
   Soft sky, soft lawn, one cool blue bubble. The scene is pinned and scroll
   drives the conversation; keep scrolling past the last line and the download
   card rises out of the same lawn (no hard seam between the two).

   Two composition rules:
     · title + mole are ONE centred cluster, nudged slightly left
     · the bubble stands well clear of him, bridged by a long tapered pointer
       that is anchored to the MOLE's box and aimed at his muzzle
   ============================================================================ */
:root{
  --sky-hi:#F4FBFE;
  --sky-lo:#D8F3FE;

  --hill-1:#DCEFD4;
  --hill-2:#C2E4AC;
  --hill-3:#A3D489;
  --lawn:#8CC776;
  --lawn-deep:#67A861;        /* their Figma green */
  --lawn-dusk:#5FA05B;        /* only a whisper below --lawn-deep: at #4F8F58
                                 the download section read as a separate block
                                 of colour instead of the same field */

  --sun:#FFE9A3;
  --sun-core:#FFD86B;
  --cloud:#FFFFFF;
  --bubble:#D8F3FE;           /* Figma: Rectangle 4 + Polygon 1 */
  --coral:#FE7251;            /* straight off his tail — the one accent */

  --paper:#FFFDF6;
  --ink:#41564A;
  --ink-70:rgba(65,86,74,.72);
  --ink-45:rgba(65,86,74,.45);
  --ink-18:rgba(65,86,74,.18);

  --display:"Fraunces",Georgia,serif;
  --text:"Quicksand",ui-rounded,"SF Pro Rounded",system-ui,sans-serif;

  --ease:cubic-bezier(.22,.68,.16,1);
  --pop:cubic-bezier(.28,1.5,.42,1);

  /* the mole, the gap, and the bubble — declared together so .pair can take
     their combined width and the whole drawing centres as one unit */
  --mole-w:clamp(184px, min(23vw,33vh), 320px);
  --gap:clamp(18px, 2.1vw, 38px);
  --bub-w:clamp(238px, 24vw, 352px);

  /* How far he steps left once the demo appears. It drives BOTH his transform
     and the .say column's left, so the mole-to-bubble distance never changes
     and the tail keeps pointing at his muzzle without touching the tail. */
  --mole-shift:0px;
}
.stage.demo-on{--mole-shift:12px;}

*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
/* the page background matches the stage gradient's top note, so no seam can
   appear above the pinned scene while it scrolls */
body{margin:0; font-family:var(--text); font-weight:500; color:var(--ink);
  background:var(--sky-hi);}

/* ============================================================================
   ACT ONE — the pinned scene
   ============================================================================ */
.rig{position:relative; height:440vh;}
.stage{position:sticky; top:0; height:100svh; overflow:hidden;
  display:grid; place-items:center;
  background:linear-gradient(179deg,var(--sky-hi) 0%,var(--sky-lo) 64%);}

.sun{position:absolute; z-index:0; left:9vw; top:9vh;
  width:clamp(66px,7.5vw,116px); aspect-ratio:1; border-radius:50%;
  background:var(--sun-core); will-change:transform;}
.sun::after{content:""; position:absolute; inset:-42%; border-radius:50%;
  background:var(--sun); opacity:.34;}

.cl{position:absolute; z-index:0; background:var(--cloud); border-radius:99px; opacity:.9;
  will-change:transform;}
.cl::before,.cl::after{content:""; position:absolute; background:var(--cloud); border-radius:50%;}
.cl::before{width:54%; height:190%; left:7%;  bottom:32%;}
.cl::after {width:38%; height:140%; right:8%; bottom:28%;}
.cl.c1{right:8vw;  top:15vh; width:clamp(84px,11vw,160px); height:clamp(21px,2.5vw,35px);}
.cl.c2{left:15vw;  top:31vh; width:clamp(54px,7vw,106px);  height:clamp(14px,1.8vw,24px); opacity:.66;}
.cl.c3{right:34vw; top:8vh;  width:clamp(42px,5.2vw,80px); height:clamp(11px,1.4vw,18px); opacity:.48;}

/* the lawn: four soft crests, the last one is the ground he sits on */
.field{position:absolute; z-index:0; left:0; right:0; bottom:0; top:0;
  pointer-events:none; will-change:transform;}
.hl{position:absolute; left:-40%; right:-40%; border-radius:50% 50% 0 0 / 100% 100% 0 0;}
.hl.h1{bottom:48%; height:20vh; background:var(--hill-1);}
.hl.h2{bottom:40%; height:20vh; background:var(--hill-2); left:-54%; right:-18%;}
.hl.h3{bottom:29%; height:22vh; background:var(--hill-3); left:-22%; right:-50%;}
/* This band runs 70px PAST the bottom of the stage on purpose. The whole .field
   is lifted by up to 16px of parallax, and at bottom:-1px that lift peeled the
   lawn off the stage's bottom edge and exposed the sky gradient behind it — the
   pale stripe that appeared between the two sections. The overhang is clipped
   by .stage's overflow:hidden, so it costs nothing. */
.hl.h4{bottom:-70px; height:calc(32% + 70px); background:var(--lawn-deep);
  border-radius:42% 58% 0 0 / 11% 11% 0 0;}

/* Little two-leaf sprouts rather than grass blades. Thin tapering blades fought
   the background: everything else here is flat, soft and round, so spiky
   strokes read as debris. Plump leaves sit in the same language. */
.sprout{position:absolute; z-index:1; pointer-events:none;
  width:clamp(24px,2.4vw,34px); height:auto;}
.sprout .lf{fill:#83BE73;}
.sprout .lf.dk{fill:#5C9B5E;}
.sprout.t1{left:6vw;   bottom:16vh; transform:scaleX(-1);}
.sprout.t2{left:24vw;  bottom:8vh;}
.sprout.t3{right:11vw; bottom:19vh;}
.sprout.t4{right:27vw; bottom:10vh; transform:scaleX(-1);}
.sprout.t5{right:4vw;  bottom:5vh;}
.sprout.t6{left:15vw;  bottom:4vh; width:clamp(20px,2vw,30px);}

/* ============================================================================
   THE CLUSTER — title and mole together, centred, a touch left of centre
   ============================================================================ */
.scene{position:relative; z-index:3; display:grid; justify-items:center;
  /* the gap is what separates them: .stage centres the column, so widening it
     lifts the title and drops the mole by the same amount */
  gap:clamp(46px,10vh,118px); transform:translateX(-4%);
  padding-bottom:clamp(20px,5vh,60px);}

.wm{text-align:center; will-change:transform;}
.wm .a{display:block; font-size:clamp(10.5px,1.2vw,14px); font-weight:700;
  letter-spacing:.56em; padding-left:.56em; text-transform:uppercase; color:var(--ink-45);}
.wm .b{display:block; margin-top:.02em;
  font-family:var(--display); font-size:clamp(72px,11vw,158px); line-height:.86;
  font-weight:900; letter-spacing:-.04em; color:#FFFFFF;
  font-variation-settings:"SOFT" 100,"WONK" 1,"opsz" 144;
  text-shadow:0 7px 0 var(--lawn-deep), 0 18px 26px rgba(65,86,74,.15);}
.wm .t{margin:clamp(8px,1.5vh,16px) auto 0; max-width:30ch;
  font-size:clamp(13px,1.35vw,16.5px); color:var(--ink-70); line-height:1.45;}

/* ---- the pair: mole + gap + bubble, so centring it centres the drawing ---- */
.pair{position:relative;
  width:calc(var(--mole-w) + var(--gap) + var(--bub-w));}
/* he steps aside when the demo comes out; .say shifts by the same amount */
.molebox{position:relative; width:var(--mole-w);
  transform:translateX(calc(-1 * var(--mole-shift)));
  transition:transform .45s var(--ease);}
.mole{display:block; width:100%; height:auto; position:relative; z-index:2;
  transform-origin:60% 96%;}
/* his feet sit at 43-86% across the 285x215 artwork */
.molebox::after{content:""; position:absolute; z-index:1;
  left:41%; width:48%; bottom:-2%; height:6%;
  border-radius:50%; background:rgba(65,86,74,.17); filter:blur(6px);}

.mole.hop{animation:hop .6s var(--pop);}
@keyframes hop{
  0%{transform:translateY(0) scale(1,1);}
  22%{transform:translateY(0) scale(1.045,.95);}
  55%{transform:translateY(-6%) scale(.985,1.035);}
  100%{transform:translateY(0) scale(1,1);}
}

/* A DIALOGUE BOX, not a lozenge. The old one had a 72px radius and no outline,
   which is exactly why it read as a formless blob — it needs a defined edge, a
   name plate and a next-indicator to look like it belongs to a game. The fill
   stays the Figma #D8F3FE. */
/* The right-hand column. It inherits the exact position the bubble used to
   have, so the verified tail-to-muzzle alignment is untouched, and it lets the
   demo sit below the bubble in normal flow — a hard-coded top would collide,
   because the bubble's height changes with each line of text. */
.say{position:absolute; z-index:3; top:-8%; width:var(--bub-w);
  left:calc(var(--mole-w) + var(--gap) - var(--mole-shift));
  transition:left .45s var(--ease);}

.bubble{position:relative; z-index:3; width:100%;
  padding:clamp(21px,2.2vw,28px) clamp(21px,2.3vw,30px) clamp(18px,1.9vw,24px);
  background:var(--bubble); border:3px solid var(--ink); border-radius:20px;
  box-shadow:0 6px 0 rgba(65,86,74,.17), 0 16px 26px rgba(65,86,74,.13);
  transform-origin:0% 55%;}
.bubble.pop{animation:pop .5s var(--pop);}
@keyframes pop{0%{transform:scale(.955);}100%{transform:scale(1);}}

/* the name plate rides astride the top edge, the way game dialogue boxes do */
.who{position:absolute; top:-14px; left:20px;
  padding:3px 13px 4px; border:3px solid var(--ink); border-radius:99px;
  background:var(--coral); color:#FFFFFF;
  font-size:10.5px; font-weight:700; letter-spacing:.16em; text-transform:uppercase;}

/* the little "keep going" chevron */
.next{position:absolute; right:15px; bottom:12px; width:13px; height:9px;
  background:var(--ink); clip-path:polygon(0 0, 100% 0, 50% 100%);
  animation:bob 1.5s var(--ease) infinite;}
@keyframes bob{0%,100%{transform:translateY(-2px); opacity:.5;}
  50%{transform:translateY(1px); opacity:1;}}

/* The tail is an OPEN path: the fill closes the triangle while the stroke draws
   only its two outer sides, so the outline runs straight into the box with no
   seam to patch. A short nub — stretched across the gap it became a thin dart
   pointing at his eye, which is what looked wrong. */
.tail{position:absolute; z-index:-1; left:-21px; top:50%; margin-top:-17px;
  width:24px; height:34px; display:block; overflow:visible;}
.tail path{fill:var(--bubble); stroke:var(--ink); stroke-width:3;
  stroke-linejoin:round; stroke-linecap:round;}

.line{margin:0; font-size:clamp(14px,1.42vw,18.5px); font-weight:600; line-height:1.5;
  color:var(--ink);}
.line span{display:inline-block; white-space:pre;
  animation:word .44s var(--ease) backwards;}
@keyframes word{from{opacity:0; transform:translateY(.5em);}to{opacity:1; transform:none;}}

/* ---------------------------------------------------------------------------
   THE DEMO — a length of the real board. Two things were broken in the first
   pass and are fixed here:
     · the sizes are declared on .demo, not .track. @keyframes reads --step off
       .demo, and while they lived on the child the calc resolved to nothing and
       the gate never moved at all.
     · width:max-content + flex-start. With justify-content:center the row of
       stones floated in the middle of the track, so the gate's absolute left no
       longer matched the first stone — that is why it framed three stones off
       to one side.
   The gate also sits UNDER the stones now, so it frames them instead of tinting
   them muddy brown.
   --------------------------------------------------------------------------- */
.demo{--sw:clamp(24px,2.4vw,32px); --sgap:clamp(6px,.7vw,9px);
  --step:calc(var(--sw) + var(--sgap));
  margin-top:clamp(12px,1.4vw,18px); width:100%;
  opacity:0; transform:translateY(12px); pointer-events:none;
  transition:opacity .5s var(--ease) .22s, transform .5s var(--ease) .22s;}
.stage.demo-on .demo{opacity:1; transform:none;}

.track{position:relative; display:flex; align-items:center; justify-content:flex-start;
  width:max-content; margin-inline:auto;
  gap:var(--sgap); padding:calc(var(--sgap) * .85) calc(var(--sgap) * 1.6);
  background:#DDD2B8; border-radius:99px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.45), 0 4px 0 rgba(65,86,74,.13);}

.stone .d{display:block; line-height:1;}
.stone{position:relative; z-index:2; flex:0 0 var(--sw); width:var(--sw); height:var(--sw);
  border-radius:50%; display:grid; place-items:center;
  background:#FFFDF6; border:2px solid rgba(110,63,34,.4); color:var(--ink);
  font-size:calc(var(--sw) * .44); font-weight:700; font-variant-numeric:tabular-nums;
  box-shadow:0 3px 0 #E3D6BA;
  transition:background .45s var(--ease), color .45s var(--ease),
             border-color .45s var(--ease), transform .13s var(--ease);}
/* the green links, for when the row comes good */
.link{position:absolute; z-index:1; top:50%; height:5px; margin-top:-2.5px;
  background:#4E9B57; border-radius:3px; opacity:0;
  transition:opacity .45s var(--ease);}

/* the gate: the only thing that travels */
.gate{position:absolute; z-index:1; top:calc(var(--sgap) * .1);
  left:calc(var(--sgap) * .9);
  height:calc(var(--sw) + var(--sgap) * 1.7);
  width:calc(var(--sw) * 4 + var(--sgap) * 4.4);
  border:3px solid #8A5E33; border-radius:99px;
  background:rgba(181,128,74,.3); box-shadow:0 3px 0 rgba(65,86,74,.12);
  transition:opacity .4s var(--ease), transform .55s var(--ease);}

/* line 2 — the gate slides the length of the row; the stones do not budge */
.demo.slide .gate{animation:gateSlide 3.8s var(--ease) infinite;}
@keyframes gateSlide{
  0%,10%  {transform:translateX(0);}
  45%,55% {transform:translateX(calc(var(--step) * 3));}
  90%,100%{transform:translateX(0);}
}
/* line 3 — it parks over the middle four, which then trade places */
.demo.flip .gate{transform:translateX(calc(var(--step) * 2));}

/* line 4 — in order, links closed, gate bows out */
.demo.done .gate{opacity:0;}
.demo.done .stone{background:#4E9B57; border-color:#3C7F46; color:#FFFDF6;
  box-shadow:0 3px 0 #3C7F46;}
.demo.done .link{opacity:1;}

.meta{display:flex; align-items:center; gap:7px; margin-top:clamp(10px,1.2vw,15px);}
.meta i{width:15px; height:4px; border-radius:2px; background:var(--ink-18);
  transition:background .35s var(--ease), width .35s var(--pop);}
.meta i.on{background:var(--coral); width:28px;}

/* ---- chrome ---- */
/* 9.5px was too small to read; the tracking tightens as the size goes up,
   because .3em starts to fall apart at this scale */
.scroll{position:absolute; z-index:4; left:50%; bottom:clamp(16px,2.8vh,30px);
  transform:translateX(-50%); display:grid; justify-items:center; gap:8px;
  font-size:clamp(12px,1.2vw,14px); font-weight:700; letter-spacing:.22em;
  text-transform:uppercase;
  color:rgba(255,255,255,.88); transition:opacity .5s var(--ease); pointer-events:none;}
.scroll i{display:block; width:2px; height:32px; border-radius:1px;
  background:linear-gradient(rgba(255,255,255,.85),transparent);
  animation:drip 1.9s var(--ease) infinite;}
@keyframes drip{0%,100%{transform:scaleY(.55); opacity:.5;}50%{transform:scaleY(1); opacity:1;}}
.stage.moved .scroll{opacity:0;}

.rail{position:absolute; z-index:4; right:clamp(12px,1.7vw,24px); top:50%;
  transform:translateY(-50%); display:grid; gap:8px;}
.rail b{display:block; width:4px; height:22px; border-radius:2px; background:var(--ink-18);
  transition:background .35s var(--ease), height .35s var(--ease);}
.rail b.on{background:var(--coral); height:34px;}

/* ============================================================================
   ACT TWO — the download card. Its field starts on exactly the lawn colour the
   stage ends on, so there is no seam where one becomes the other.
   ============================================================================ */
/* The handoff: this section opens on exactly the lawn colour the pinned scene
   ends on, so no line appears where one becomes the other, and a soft crest
   swells over the join so the ground reads as continuing rather than switching. */
/* margin-top pulls this section up over the pinned scene's bottom edge. 100svh
   and 440vh round to fractional pixels, and the 1px of page background showing
   through that crack was the pale blue line at the join. */
.get{position:relative; z-index:5; min-height:100svh; overflow:hidden;
  margin-top:-3px;
  display:grid; place-items:center; padding:clamp(56px,10vh,110px) 6vw clamp(52px,8vh,92px);
  background:linear-gradient(var(--lawn-deep) 0%, var(--lawn-deep) 38%, var(--lawn-dusk) 100%);}
/* No crest and no overlay here on purpose. Both a lighter swell and a darker
   gradient at the top registered as "a different section" when scrolling
   through; the join reads as one continuous field only when the colour simply
   carries on unchanged and the darkening starts well below the fold. */

/* the card rises as it comes into view, instead of just being there */
.card{position:relative; z-index:1; display:grid; justify-items:center; gap:clamp(13px,2.2vh,24px);
  text-align:center; max-width:500px; width:100%;
  padding:clamp(28px,4vw,48px) clamp(24px,3.6vw,48px);
  background:var(--paper); border:3px solid var(--ink); border-radius:clamp(24px,3vw,34px);
  box-shadow:0 8px 0 rgba(30,60,38,.2), 0 22px 44px rgba(30,60,38,.22);
  opacity:0; transform:translateY(38px) scale(.972);
  transition:opacity .8s var(--ease), transform .8s var(--ease);}
.card.in{opacity:1; transform:none;}

/* then the contents arrive one after another, so the panel assembles itself
   instead of appearing all at once */
.card > *{opacity:0; transform:translateY(15px);
  transition:opacity .55s var(--ease), transform .55s var(--ease);}
.card.in > *{opacity:1; transform:none;}
.card.in .appicon{transition-delay:.16s;}
.card.in h2     {transition-delay:.26s;}
.card.in .sub   {transition-delay:.35s;}
.card.in .play-note{transition-delay:.44s;}
.card.in .badge {transition-delay:.54s;}
/* the icon gets a little landing bounce on top of its fade */
.card.in .appicon{animation:iconIn .66s var(--pop) .16s backwards;}
@keyframes iconIn{0%{transform:translateY(-16px) scale(.82) rotate(-7deg);}
  100%{transform:none;}}
/* and the code pushes in slightly, like it is being offered to the camera */
.card.in .play-note{animation:qrIn .6s var(--pop) .44s backwards;}
@keyframes qrIn{0%{transform:scale(.9);}100%{transform:none;}}

/* the logo is the mole on his grass block, so it centres in the tile rather
   than sitting on the bottom edge the way the bare mascot did */
/* the tile was washing out at #F4FBFE -> #D8F3FE, so the gradient now runs a
   couple of steps deeper, and the shadow is bigger so it lifts off the card */
.appicon{width:clamp(84px,10vw,118px); aspect-ratio:1; border-radius:24%;
  background:linear-gradient(168deg,#D7F0FB 0%,#A6DBF1 100%);
  box-shadow:0 14px 26px rgba(65,86,74,.3), 0 4px 0 rgba(65,86,74,.1);
  display:grid; place-items:center; overflow:hidden;}
.appicon svg{width:88%; height:auto; display:block;}

.get h2{margin:0; font-family:var(--display); font-weight:900;
  font-size:clamp(26px,3.6vw,44px); line-height:1.04; letter-spacing:-.025em; color:var(--ink);
  font-variation-settings:"SOFT" 100,"WONK" 1,"opsz" 144;}
.get .sub{margin:0; font-size:clamp(13px,1.4vw,16px); color:var(--ink-70); max-width:32ch;}

.play-note{display:flex; align-items:center; gap:12px; margin-top:2px;
  padding:12px 16px; border:2px solid var(--ink-18); border-radius:16px;
  background:rgba(216,243,254,.58); color:var(--ink);}
.play-note svg{width:29px; height:29px; flex:0 0 auto; fill:none;
  stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}
.play-note span{display:grid; gap:2px; text-align:left;}
.play-note strong{font-size:13px; font-weight:700;}
.play-note small{font-size:10px; font-weight:600; color:var(--ink-70);
  letter-spacing:.04em;}

.badge{display:inline-flex; align-items:center; gap:10px; text-decoration:none;
  padding:11px 21px 11px 17px; border-radius:12px; background:#1B2A20; color:#FFFFFF;
  box-shadow:0 8px 18px rgba(30,60,38,.28);
  transition:transform .16s var(--ease), box-shadow .16s var(--ease);}
.badge:hover{transform:translateY(-2px); box-shadow:0 12px 22px rgba(30,60,38,.34);}
.badge:active{transform:translateY(1px);}
.badge svg{width:22px; height:22px; fill:currentColor; flex:0 0 auto;}
.badge span{display:grid; text-align:left; line-height:1.14;}
.badge .s1{font-size:9px; font-weight:500; opacity:.82; letter-spacing:.08em; text-transform:uppercase;}
.badge .s2{font-size:16.5px; font-weight:700; letter-spacing:-.01em;}

.get footer{position:absolute; bottom:clamp(16px,3vh,30px); left:0; right:0;
  text-align:center; font-size:9.5px; font-weight:700; letter-spacing:.3em;
  text-transform:uppercase; color:rgba(255,255,255,.5);}

/* ============================================================================
   NARROW — he goes centre stage, the bubble sits above him
   ============================================================================ */
@media (max-width:880px){
  /* One screen, no scroll runway: on a phone the talk is advanced by TAPPING,
     so there is nothing to scroll through. The page only becomes scrollable
     once the conversation is finished, and then it goes to the download card. */
  .rig{height:100svh;}
  .stage{cursor:pointer;}
  /* Phones get their own composition rather than a squeezed desktop one. The
     title is pinned to the top and the group below it fills the whole remaining
     height, which kills the ~250px of dead grass the centred version left, and
     he can be much bigger — he is the hero of the page.
     It also stacks in real flow: the old narrow layout kept .say absolutely
     positioned at bottom:104%, so .pair reserved only the mole's height and the
     dialogue punched up through the title. */
  .stage{place-items:stretch; --pair-w:min(90vw,420px); --mole-narrow:min(258px,57vw,27vh);}
  /* One tight column, centred as a whole. Pinning the title to the top and
     centring the group underneath opened a big void between them on anything
     taller than a phone (a tablet in portrait is ~1.3 aspect, not 2.2). */
  .scene{transform:none; height:100%; width:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:clamp(16px,3vh,34px);
    padding:clamp(20px,4vh,44px) 0 clamp(40px,7vh,72px);}

  .wm{flex:0 0 auto;}
  /* the title carries the page on a phone, so it runs bigger here than the
     desktop ramp would give, and he gives up a little size to it */
  .wm .a{font-size:clamp(11.5px,3vw,14px); letter-spacing:.5em; padding-left:.5em;}
  .wm .b{font-size:clamp(68px,20.5vw,118px);}
  .wm .t{max-width:23ch; font-size:clamp(14px,4vw,17.5px);}

  /* the group takes everything the title leaves, and centres inside it */
  /* min-height:0 lets this shrink rather than overflow: centred content inside
     a flex:1 track spills BOTH ways when it is too tall, which is how the
     dialogue ended up sitting on top of the tagline on a short phone. */
  .pair{flex:0 1 auto; min-height:0; width:var(--pair-w);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:clamp(10px,1.8vh,24px);}
  /* display:contents dissolves .say so bubble / mole / demo are siblings and can
     be ordered: spoken to from above, board at his feet. That also puts the
     bubble's nub over his muzzle instead of over the demo strip. */
  .say{display:contents;}
  .bubble{position:relative; order:1; width:100%;}
  .molebox{order:2; width:var(--mole-narrow); transform:none;}
  /* the board reads bigger on a phone, and he gives up a little size for it:
     these scale off vw so the stones grow with the screen instead of sitting on
     the desktop floor value of 24px */
  .demo{order:3; width:100%; margin-top:0;
    --sw:clamp(30px,8.4vw,40px); --sgap:clamp(7px,2.1vw,11px);}
  /* no stepping aside on a phone: he is centred under the bubble, and a shift
     would pull him out from under his own tail */
  .stage.demo-on{--mole-shift:0px;}

  /* the nub drops onto his muzzle, which sits 75% across the artwork — and the
     artwork is centred inside .pair */
  .tail{right:auto; top:auto; bottom:-25px; margin:0 0 0 -17px;
    left:calc((var(--pair-w) - var(--mole-narrow)) / 2 + var(--mole-narrow) * .75);
    transform:rotate(-90deg);}

  .rail{display:none;}
  .sun{left:6vw; top:5vh; width:clamp(54px,15vw,80px);}
  .cl.c3{display:none;}
  .scroll{bottom:clamp(10px,1.8vh,20px);}
  /* the download card gets room to breathe on a small screen */
  .get{padding:clamp(40px,7vh,76px) 5vw clamp(56px,9vh,88px);}
  .card{padding:clamp(24px,6vw,36px) clamp(20px,5vw,30px); gap:clamp(12px,2vh,18px);}
  .get h2{font-size:clamp(24px,6.4vw,34px);}
}

/* the scroll lock for tap mode. Set on <html> so it holds on iOS too. */
html.tap-locked, html.tap-locked body{overflow:hidden; height:100%;}
/* a tap target hint that reads as a button rather than a scroll cue */
.scroll.tap span{font-size:clamp(11px,2.8vw,13px);}
.scroll.tap i{display:none;}

@media (prefers-reduced-motion:reduce){
  *{animation:none !important; transition-duration:1ms !important;}
}

</section>

<script>
/* ============================================================================
   Scroll drives everything: one rAF-throttled read gives a continuous 0..1 for
   the parallax and a discrete index for the line.
   ============================================================================ */
const LINES = [
  'Hi! My stones lost their order. Can you help me line them up?',
  'You slide my little wooden gate around the ring. The stones stay put.',
  'Then you flip it — and the four stones inside turn right around.',
  'Get one to twenty into a single unbroken circle, and everything blooms.'
];

const $ = id => document.getElementById(id);
const rig = $('rig'), stage = $('stage'), bubble = $('bubble'), mole = $('mole');
const clouds = [...document.querySelectorAll('.cl')];

/* dots and rail ticks are built from LINES, so they can never disagree with it */
const dots  = LINES.map(() => $('meta').appendChild(document.createElement('i')));
const ticks = LINES.map(() => $('railui').appendChild(document.createElement('b')));

let at = -1;

function writeLine(text){
  const p = $('line');
  p.textContent = '';
  text.split(' ').forEach((w,i) => {
    const s = document.createElement('span');
    s.textContent = i ? ' ' + w : w;
    s.style.animationDelay = (i * 26) + 'ms';
    p.appendChild(s);
  });
}
function replay(el, cls){
  el.classList.remove(cls);
  void el.offsetWidth;                 /* reflow, so the animation restarts */
  el.classList.add(cls);
}
/* ---- the demo strip: 7 stones on fixed slots, one gate that travels ---- */
const SCRAMBLED = [3, 7, 1, 5, 2, 6, 4];
const demo = $('demo'), track = $('track');

const stones = SCRAMBLED.map(n => {
  const s = document.createElement('div');
  s.className = 'stone';
  const d = document.createElement('span');
  d.className = 'd';
  d.textContent = n;
  s.appendChild(d);
  s.digit = d;
  return s;
});
(function buildTrack(){
  /* the links sit in the gaps, positioned off the very same custom properties
     the track sizes itself with, so they hold at any viewport width */
  for(let i = 0; i < stones.length - 1; i++){
    const l = document.createElement('span');
    l.className = 'link';
    l.style.left  = `calc(var(--sgap) * 1.6 + ${i + 1} * var(--sw) + ${i} * var(--sgap))`;
    l.style.width = 'var(--sgap)';
    track.appendChild(l);
  }
  stones.forEach(s => track.appendChild(s));
  const g = document.createElement('div');
  g.className = 'gate';
  track.appendChild(g);
})();

/* The parked gate covers slots 2-5. The flip is aligned with the real game:
   index.html's flipWindow() reverses the four values in place and gives those
   four one quiet uniform scale(.94) dip for 130ms — nothing arcs, lifts or
   swings past anything. The earlier version slid stones over each other, which
   looked strange and is not what the game does. A flip is self-inverse, so
   repeating it simply alternates between the two states. */
const WINDOW = [2, 3, 4, 5];
const DIP_MS = 130, SWAP_MS = 440;
let order = SCRAMBLED.slice();
let flipTimer = 0;

function paintNumbers(list){
  stones.forEach((s, i) => s.digit.textContent = list[i]);
}
function flipFour(){
  const rev = WINDOW.map(k => order[k]).reverse();
  /* Each digit leaves towards the slot it is travelling to, blinks out, and
     arrives from the opposite side — so the reordering is legible without the
     stones themselves flying over each other, which is what looked overdone.
     The outer pair travels further than the inner pair, so it moves further. */
  WINDOW.forEach((k, j) => {
    const slots = (WINDOW.length - 1 - 2 * j);        /* +3, +1, -1, -3 */
    const dx = Math.sign(slots) * (Math.abs(slots) > 1 ? 9 : 5);
    stones[k].digit.animate([
      {transform:'translateX(0)',            opacity:1, offset:0},
      {transform:`translateX(${dx}px)`,      opacity:0, offset:.42},
      {transform:`translateX(${-dx}px)`,     opacity:0, offset:.58},
      {transform:'translateX(0)',            opacity:1, offset:1}
    ], {duration:SWAP_MS, easing:'ease-in-out'});
    /* swap the value while it is invisible, halfway through */
    setTimeout(() => { stones[k].digit.textContent = rev[j]; }, SWAP_MS * .5);
    /* and the same quiet uniform dip the game itself uses */
    stones[k].style.transform = 'scale(.94)';
    setTimeout(() => { stones[k].style.transform = ''; }, DIP_MS);
  });
  WINDOW.forEach((k, j) => order[k] = rev[j]);
}
function setDemo(i){
  clearInterval(flipTimer); flipTimer = 0;
  order = SCRAMBLED.slice();
  stones.forEach(s => s.style.transform = '');

  stage.classList.toggle('demo-on', i >= 1);
  demo.classList.toggle('slide', i === 1);
  demo.classList.toggle('flip',  i === 2);
  demo.classList.toggle('done',  i === 3);

  paintNumbers(i === 3 ? SCRAMBLED.map((_, k) => k + 1) : order);

  if(i === 2 && !matchMedia('(prefers-reduced-motion:reduce)').matches){
    setTimeout(flipFour, 500);
    flipTimer = setInterval(flipFour, 2000);
  }
}

function setLine(i){
  at = i;
  writeLine(LINES[i]);
  replay(bubble, 'pop');
  replay(mole, 'hop');
  setDemo(i);
  dots.forEach((d,k) => d.classList.toggle('on', k === i));
  ticks.forEach((t,k) => t.classList.toggle('on', k === i));
  applyMode();
}

/* Phones advance the talk by tapping; desktops scrub it with the scroll wheel.
   Below 880px the page is also locked until the last line, so scrolling down
   always means "I have read it, take me to the download". */
const tapMode = () => matchMedia('(max-width:880px)').matches;
const finished = () => at >= LINES.length - 1;

function applyMode(){
  const tap = tapMode();
  document.documentElement.classList.toggle('tap-locked', tap && !finished());
  $('hint').classList.toggle('tap', tap && !finished());
  $('hintword').textContent = !tap ? 'scroll'
    : finished() ? 'scroll to play' : 'tap to continue';
}

function frame(){
  const span = rig.offsetHeight - innerHeight;
  const p = span > 0 ? Math.min(1, Math.max(0, scrollY / span)) : 0;

  /* the hint only fades on desktop, where scrolling is the verb */
  stage.classList.toggle('moved', !tapMode() && p > .015);

  clouds.forEach(c => c.style.transform = `translateX(${p * +c.dataset.depth}px)`);
  $('field').style.transform = `translateY(${p * -16}px)`;
  $('sun').style.transform   = `translateY(${p * 26}px)`;
  $('wm').style.transform    = `translateY(${p * -38}px)`;

  if(tapMode()) return;                 /* scroll must not drive the line here */
  const i = Math.min(LINES.length - 1, Math.floor(p * LINES.length * 0.999));
  if(i !== at) setLine(i);
}

let queued = false;
addEventListener('scroll', () => {
  if(queued) return;
  queued = true;
  requestAnimationFrame(() => { queued = false; frame(); });
}, {passive:true});
addEventListener('resize', () => { applyMode(); frame(); });
addEventListener('orientationchange', () => setTimeout(() => { applyMode(); frame(); }, 250));

/* tap anywhere on the scene for the next line (phones only) */
stage.addEventListener('click', () => {
  if(!tapMode() || finished()) return;
  setLine(at + 1);
});
addEventListener('keydown', e => {
  if(!tapMode()) return;
  if((e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight') && !finished()){
    e.preventDefault(); setLine(at + 1);
  }
});

/* reveal the download card as it scrolls into view */
const card = document.querySelector('.card');
if('IntersectionObserver' in window){
  new IntersectionObserver((es,o) => es.forEach(e => {
    if(e.isIntersecting){ card.classList.add('in'); o.unobserve(e.target); }
  }), {threshold:0, rootMargin:'0px 0px -22% 0px'}).observe(card);
}else{
  card.classList.add('in');
}

setLine(0);
applyMode();
frame();
</script>
</body>
