<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b3e5fd">
  <title>Loop 20 — Cozy Garden Music Prototype</title>
  <style>
    :root {
      color-scheme: light;
      font-family: ui-rounded, "SF Pro Rounded", "Avenir Next Rounded", system-ui, sans-serif;
      --ink: #2c4433;
      --cream: #fffdf6;
      --coral: #ff8261;
      --coral-shadow: #f06443;
      --brown: #774834;
      --green: #35784a;
      --hill: #7ebf68;
      --hill-dark: #61a45f;
      --sky: #b3e5fd;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 78% 12%, #ffc44e 0 8vw, transparent 8.15vw),
        linear-gradient(var(--sky) 0 58%, var(--hill) 58% 77%, var(--hill-dark) 77%);
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      z-index: -1;
      left: -10vw;
      width: 120vw;
      height: 34vh;
      border-radius: 50% 50% 0 0;
      pointer-events: none;
    }

    body::before {
      bottom: 7vh;
      background: var(--hill);
      transform: rotate(-4deg);
    }

    body::after {
      bottom: -13vh;
      background: var(--hill-dark);
      transform: rotate(5deg);
    }

    main {
      width: min(92vw, 430px);
      padding: max(24px, env(safe-area-inset-top)) 0 max(28px, env(safe-area-inset-bottom));
    }

    .prototype {
      margin: 0 0 10px;
      color: rgb(44 68 51 / 68%);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-align: center;
    }

    .card {
      position: relative;
      overflow: hidden;
      padding: 30px 24px 25px;
      border: 2px solid rgb(119 72 52 / 35%);
      border-radius: 38px;
      background: rgb(255 253 246 / 94%);
      box-shadow:
        0 8px 0 rgb(221 210 184 / 92%),
        0 22px 50px rgb(44 68 51 / 20%);
      text-align: center;
    }

    .card::after {
      content: "PROTOTYPE";
      position: absolute;
      right: -31px;
      bottom: 20px;
      transform: rotate(-28deg);
      color: rgb(119 72 52 / 7%);
      font-size: 2.25rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      pointer-events: none;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--green);
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 10vw, 3.1rem);
      line-height: 0.98;
      letter-spacing: -0.045em;
    }

    .subtitle {
      margin: 10px 0 22px;
      color: rgb(44 68 51 / 72%);
      font-size: 0.94rem;
      line-height: 1.45;
    }

    .art {
      position: relative;
      width: 172px;
      height: 172px;
      margin: 0 auto 22px;
      display: grid;
      place-items: center;
      border: 5px solid #a58773;
      border-radius: 50%;
      background:
        radial-gradient(circle, #fffdf6 0 15%, transparent 15.5%),
        repeating-radial-gradient(circle, #35784a 0 7px, #2f6c42 8px 12px);
      box-shadow: 0 7px 0 #ddd2b8;
      transition: transform 220ms ease;
    }

    .art::before {
      content: "♪";
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--cream);
      background: var(--coral);
      font-size: 2rem;
      font-weight: 900;
      box-shadow: inset 0 -4px 0 rgb(119 72 52 / 20%);
    }

    .playing .art {
      animation: turn 9s linear infinite;
    }

    @keyframes turn {
      to { transform: rotate(360deg); }
    }

    .wave {
      height: 34px;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .wave span {
      width: 4px;
      height: var(--h);
      border-radius: 999px;
      background: var(--green);
      opacity: 0.38;
      transform: scaleY(0.55);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .playing .wave span {
      opacity: 0.9;
      animation: bounce 900ms ease-in-out infinite alternate;
      animation-delay: calc(var(--i) * -62ms);
    }

    @keyframes bounce {
      from { transform: scaleY(0.45); }
      to { transform: scaleY(1); }
    }

    .transport {
      display: grid;
      grid-template-columns: 48px 1fr 48px;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .time {
      font-variant-numeric: tabular-nums;
      color: rgb(44 68 51 / 70%);
      font-size: 0.74rem;
      font-weight: 700;
    }

    input[type="range"] {
      width: 100%;
      height: 20px;
      margin: 0;
      accent-color: var(--green);
      cursor: pointer;
    }

    .play {
      width: min(100%, 220px);
      min-height: 64px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 2px solid var(--brown);
      border-radius: 31px;
      color: var(--ink);
      background: var(--coral);
      box-shadow: 0 6px 0 var(--coral-shadow);
      font: inherit;
      font-size: 1.2rem;
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 100ms ease, box-shadow 100ms ease;
    }

    .play:active {
      transform: translateY(5px);
      box-shadow: 0 1px 0 var(--coral-shadow);
    }

    .play:focus-visible,
    a:focus-visible,
    input:focus-visible {
      outline: 4px solid rgb(53 120 74 / 30%);
      outline-offset: 3px;
    }

    .play-icon {
      width: 0;
      height: 0;
      border-top: 8px solid transparent;
      border-bottom: 8px solid transparent;
      border-left: 13px solid var(--ink);
    }

    .playing .play-icon {
      width: 12px;
      height: 16px;
      border: 0;
      background: linear-gradient(90deg, var(--ink) 0 34%, transparent 34% 66%, var(--ink) 66%);
    }

    .details {
      margin: 24px 0 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .detail {
      padding: 11px 5px;
      border: 1px solid rgb(119 72 52 / 16%);
      border-radius: 17px;
      background: rgb(221 210 184 / 32%);
    }

    .detail strong,
    .detail small {
      display: block;
    }

    .detail strong {
      margin-bottom: 2px;
      font-size: 0.8rem;
    }

    .detail small {
      color: rgb(44 68 51 / 62%);
      font-size: 0.66rem;
    }

    nav {
      margin-top: 21px;
      display: flex;
      justify-content: center;
      gap: 20px;
      font-size: 0.78rem;
      font-weight: 750;
    }

    a {
      color: var(--ink);
      text-underline-offset: 4px;
    }

    .status {
      min-height: 1.4em;
      margin: 13px 0 0;
      color: rgb(44 68 51 / 66%);
      font-size: 0.72rem;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main id="player">
    <p class="prototype">LOOP 20 · MUSIC PROTOTYPE</p>
    <section class="card" aria-labelledby="track-title">
      <p class="eyebrow">Original game background music</p>
      <h1 id="track-title">Cozy Garden</h1>
      <p class="subtitle">溫暖花園 · 木琴、撥弦與柔和節拍<br>輕鬆、不催促，適合慢慢解謎。</p>

      <div class="art" aria-hidden="true"></div>

      <div class="wave" aria-hidden="true">
        <span style="--i:0;--h:13px"></span><span style="--i:1;--h:23px"></span>
        <span style="--i:2;--h:31px"></span><span style="--i:3;--h:18px"></span>
        <span style="--i:4;--h:28px"></span><span style="--i:5;--h:16px"></span>
        <span style="--i:6;--h:34px"></span><span style="--i:7;--h:22px"></span>
        <span style="--i:8;--h:29px"></span><span style="--i:9;--h:15px"></span>
        <span style="--i:10;--h:26px"></span><span style="--i:11;--h:33px"></span>
        <span style="--i:12;--h:19px"></span><span style="--i:13;--h:28px"></span>
        <span style="--i:14;--h:14px"></span><span style="--i:15;--h:24px"></span>
        <span style="--i:16;--h:32px"></span><span style="--i:17;--h:20px"></span>
        <span style="--i:18;--h:27px"></span><span style="--i:19;--h:12px"></span>
      </div>

      <div class="transport">
        <span class="time" id="elapsed">0:00</span>
        <input id="seek" type="range" min="0" max="40" value="0" step="0.01" aria-label="播放進度">
        <span class="time">0:40</span>
      </div>

      <button class="play" id="play" type="button" aria-pressed="false">
        <span class="play-icon" aria-hidden="true"></span>
        <span id="play-label">播放音樂</span>
      </button>

      <p class="status" id="status" role="status">點擊播放 · 音樂會自動無縫循環</p>

      <div class="details" aria-label="音樂資訊">
        <div class="detail"><strong>40 秒</strong><small>Seamless loop</small></div>
        <div class="detail"><strong>96 BPM</strong><small>Gentle pace</small></div>
        <div class="detail"><strong>原創</strong><small>Loop 20 v1</small></div>
      </div>

      <nav>
        <a href="audio/loop20-cozy-garden.mp3" download>下載 MP3</a>
        <a href="index.html">返回遊戲</a>
      </nav>

      <audio id="audio" preload="metadata" loop>
        <source src="audio/loop20-cozy-garden.m4a" type="audio/mp4">
        <source src="audio/loop20-cozy-garden.mp3" type="audio/mpeg">
        <source src="audio/loop20-cozy-garden.wav" type="audio/wav">
      </audio>
    </section>
  </main>

  <script>
    const player = document.querySelector("#player");
    const audio = document.querySelector("#audio");
    const playButton = document.querySelector("#play");
    const playLabel = document.querySelector("#play-label");
    const seek = document.querySelector("#seek");
    const elapsed = document.querySelector("#elapsed");
    const status = document.querySelector("#status");

    function formatTime(seconds) {
      const safeSeconds = Number.isFinite(seconds) ? Math.max(0, seconds) : 0;
      const minutes = Math.floor(safeSeconds / 60);
      const remainder = Math.floor(safeSeconds % 60);
      return `${minutes}:${String(remainder).padStart(2, "0")}`;
    }

    function setPlaying(isPlaying) {
      player.classList.toggle("playing", isPlaying);
      playButton.setAttribute("aria-pressed", String(isPlaying));
      playLabel.textContent = isPlaying ? "暫停音樂" : "播放音樂";
      status.textContent = isPlaying
        ? "正在循環播放 · Cozy Garden"
        : "已暫停 · 再按一次繼續";
    }

    playButton.addEventListener("click", async () => {
      if (audio.paused) {
        try {
          await audio.play();
        } catch (error) {
          status.textContent = "瀏覽器暫時無法播放，請再點一次。";
        }
      } else {
        audio.pause();
      }
    });

    audio.addEventListener("play", () => setPlaying(true));
    audio.addEventListener("pause", () => setPlaying(false));
    audio.addEventListener("loadedmetadata", () => {
      seek.max = Number.isFinite(audio.duration) ? audio.duration : 40;
    });
    audio.addEventListener("timeupdate", () => {
      seek.value = audio.currentTime;
      elapsed.textContent = formatTime(audio.currentTime);
    });
    audio.addEventListener("error", () => {
      status.textContent = "音檔載入失敗，請重新整理頁面。";
    });

    seek.addEventListener("input", () => {
      audio.currentTime = Number(seek.value);
      elapsed.textContent = formatTime(audio.currentTime);
    });
  </script>
</body>
</html>
